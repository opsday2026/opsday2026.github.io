<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>OpsDay 2026 - Live Wall</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
<div id="liveScreen">
    <img id="logo" src="QrBar.png" alt="Logo">
    <span id="logotext">Inquadra il qrcode e condividi i momenti migliori di questa giornata!</span>
    <div id="status" class="status">Verifica accesso in corso...</div>

    <div class="live-column left-column">
        <div id="photoFrame">
            <img id="photoImage" alt="Foto live" loading="eager">
            <button id="nextPhotoButton" class="next-photo-button" type="button" aria-label="Mostra la foto successiva" title="Mostra la foto successiva"></button>
        </div>
    </div>

    <div class="live-column right-column">
        <div id="photoComment" class="photo-comment">Attesa immagini...</div>
        <div id="photoInfo" class="photo-info" hidden>Attendi la prossima foto.</div>

        <button id="playPause" class="play-pause" type="button" aria-label="Pausa">
            <!-- icon injected by JS -->
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="live_random.js"></script>

</body>

</html>
