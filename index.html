<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>OpsDay 2026</title>

<link rel="stylesheet" href="style.css">

</head>


<body>
<div id="uploadScreen">
    <img id="logo" src="Logo.png" alt="Logo">

    <video 
        id="camera"
        autoplay
        playsinline>
    </video>

    <div id="cameraFallback" class="camera-fallback hidden">
        Consenti l'accesso alla fotocamera per continuare.
    </div>

    <button id="takePhoto">
        <span></span>
    </button>

</div>

<div id="status" class="status">Verifica accesso in corso...</div>


<canvas id="canvas" class="hidden"></canvas>    

<div id="previewScreen" class="hidden">

    <img id="previewImage">

    <div id="successOverlay" class="success-overlay hidden">
        <div class="success-card">
            <p>Foto inviata 🎉</p>
            <button id="successOk" type="button">OK</button>
        </div>
    </div>

    <div class="overlay">

        <textarea 
            id="comment"
            placeholder="Scrivi un commento...">
        </textarea>

        <button onclick="sendPhoto()">
            Invia
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>


</body>

</html>
