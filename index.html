<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OpsDay 2026</title>

<link rel="stylesheet" href="style.css">

</head>


<body>
<div id="uploadScreen">

    <video 
        id="camera"
        autoplay
        playsinline>
    </video>

    <button id="takePhoto">
        <span></span>
    </button>

</div>

<div id="status" class="status">Verifica accesso in corso...</div>
<img id="logo" src="Logo.png" alt="Logo">

<canvas id="canvas" class="hidden"></canvas>    

<div id="previewScreen" class="hidden">

    <img id="previewImage">

    <div class="overlay">

        <textarea 
            id="comment"
            placeholder="Scrivi un commento...">
        </textarea>

        <button onclick="sendPhoto()">
            Invia
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>


</body>

</html>
