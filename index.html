<!DOCTYPE html>
<html lang="it">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">

        <title>OpsDay 2026</title>

        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    </head>

    <body>
        <div id="background"></div>
        <label id="unauthorized" class="success-overlay hidden">
                <p>Non sei autorizzato a inviare foto.</p>
                <p>Contatta l'organizzazione per ricevere un invito.</p>
            </label>
        <div id="status" class="status">Verifica accesso in corso...</div>
        <div id="uploadScreen" class="hidden">
            
            <img id="logoTopRight" src="Logo.png" alt="Logo">
            <img id="logoTopLeft" src="https://aadcdn.msftauthimages.net/c1c6b6c8-y0ttu-qrv1hztm2vbitcbzn2dphdtc3lwrqvcb6okxa/logintenantbranding/0/bannerlogo?ts=638798065923306332" alt="Logo">


            <button id="takePhotoButton" type="button"><span class="icon">📷 </span>  Scattati una foto
            </button>

            <input
                id="photoInput"
                type="file"
                accept="image/*"
                capture="user"
                hidden>

            
            <div id="content" class="hidden">
                <img id="previewImage">

                <div id="successOverlay" class="success-overlay hidden">
                    <div class="success-card">
                        <p>Foto inviata 🎉</p>
                        <button id="successOk" type="button">OK</button>
                    </div>
                </div>
                
                <div class="overlay">

                    <textarea
                        id="comment"
                        placeholder="Scrivi un commento..."
                        maxlength="140"></textarea>
                    <div style="color: #fff; background: radial-gradient(
                                                                ellipse at center,
                                                                rgba(0, 0, 0, 1) 0%,
                                                                rgba(0, 0, 0, 0.8) 30%,
                                                                rgba(0, 0, 0, 0) 100%
                                                            )" ><span id="counter" >140</span> caratteri rimasti</div>
                    <script>
                    const textarea = document.getElementById('comment');
                    const counter = document.getElementById('counter');

                    textarea.addEventListener('input', () => {
                        counter.textContent = 140 - textarea.value.length;
                    });
                    </script>
                    <button id="sendButton" type="button">Invia</button>
                    <button id="cancelButton" type="button">Annulla</button>

                </div>

            </div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="photo.js"></script>

    </body>
</html>
